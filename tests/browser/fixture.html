<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gate Frame browser fixture</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      #target {
        position: relative;
        width: 300px;
        height: 342px;
        padding: 120px 32px 32px;
        border: 1px solid black;
      }
    </style>
  </head>
  <body>
    <div id="target">
      <span id="first-child">First</span>
      <button id="second-child" type="button">Second</button>
    </div>
    <script type="module">
      import * as gateFramePackage from "/dist/index.js";

      window.gateFramePackage = gateFramePackage;
      window.dispatchEvent(new Event("gate-frame-package-ready"));
    </script>
  </body>
</html>
